[project]
name = "ffp-agent-verify"
version = "0.1.0"
description = "Verification and risk scoring for automated frequent-flyer award search traffic"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "redis>=5.0",
    "asyncpg>=0.29",
    "pyjwt[crypto]>=2.9",
    "cryptography>=43",
    "httpx>=0.27",
    "orjson>=3.10",
    "prometheus-client>=0.20",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "aiohttp>=3.10",
]

[project.scripts]
ffpv-worker = "ffpverify.risk.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ffpverify"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: needs Redis + Postgres (docker compose up)",
]
